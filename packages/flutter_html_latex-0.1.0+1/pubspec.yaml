name: flutter_html_latex
description: "LaTeX support for flutter_widget_from_html_core via math-tex HTML class rendering."
repository: https://github.com/avijitbarua/flutter_html_latex.git
version: 0.1.0+1
license: MIT

environment:
  sdk: ^3.10.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_widget_from_html_core: #^0.17.0
    path: ./packages/flutter_widget_from_html_core-0.17.4
  flutter_math_fork: #^0.7.4
    path: ./packages/flutter_math_fork-0.7.4
  flutter_tex: #^5.2.6
    path: ./packages/flutter_tex-5.2.7



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:


topics:
- flutter
- html
- latex
- math
- flutter-widget
platforms:
  android:
  ios:
  web:
